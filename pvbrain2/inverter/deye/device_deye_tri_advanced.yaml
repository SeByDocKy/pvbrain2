# ─────────────────────────────────────────────────────────────
#  Deye Hybrid Inverter (three-phase) – Advanced TOU settings
#  ESPHome 2026.9.0 modbus_controller
#   • register_count removed (derived from value_type)
#   • reuse_previous_range: true bridges address gaps
#   • multiply: 100 → 0.01 (2026.9.0 semantics)
#
#  Single-phase -> three-phase mapping (offset -102, same as
#  device_deye_tri_nominal.yaml: 201->99, 243->141, 247->145, 293->191):
#     248        -> 146        TOU enable / days
#     250..255   -> 148..153   time points 1..6 (HHMM)
#     256..261   -> 154..159   power 1..6
#     262..267   -> 160..165   battery voltage 1..6
#     268..273   -> 166..171   SoC 1..6
#     274..279   -> 172..177   charge type 1..6 (bit0 grid, bit1 gen, bit2 GM, bit3 BU, bit4 CH)
#
#  Modbus read ranges (holding):
#   A: 013–014  (2 regs)  firmware versions
#   B: 146–177  (32 regs) TOU settings
# ─────────────────────────────────────────────────────────────

sensor:
  # ── Range A: 013–014 firmware ──
  - platform: modbus_controller            # 013 Firmware Control Board
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_firmware_control_board
    id: ${inverter_name}_firmware_control_board
    register_type: holding
    address: 13

  - platform: modbus_controller            # 014 Firmware Comms Board
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_firmware_comms_board
    id: ${inverter_name}_firmware_comms_board
    register_type: holding
    address: 14

  ############################################# READ SETTINGS #############################################

  # ── Range B: 146–177 TOU settings ──
  - platform: modbus_controller          # 148 Settings Timezone1
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_setting_timezone1
    id: ${inverter_name}_setting_timezone1
    register_type: holding
    address: 148
    reuse_previous_range: true                     # bridge 146→148
    filters:
      - lambda: |-
          if (x > 32767) return (x - 65535) /1;
          else return (x) /1;
    icon: "mdi:clock"

  - platform: modbus_controller          # 149 Settings Timezone2
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_setting_timezone2
    id: ${inverter_name}_setting_timezone2
    register_type: holding
    address: 149
    filters:
      - lambda: |-
          if (x > 32767) return (x - 65535) /1;
          else return (x) /1;
    icon: "mdi:clock"

  - platform: modbus_controller          # 150 Settings Timezone3
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_setting_timezone3
    id: ${inverter_name}_setting_timezone3
    register_type: holding
    address: 150
    filters:
      - lambda: |-
          if (x > 32767) return (x - 65535) /1;
          else return (x) /1;
    icon: "mdi:clock"

  - platform: modbus_controller          # 151 Settings Timezone4
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_setting_timezone4
    id: ${inverter_name}_setting_timezone4
    register_type: holding
    address: 151
    filters:
      - lambda: |-
          if (x > 32767) return (x - 65535) /1;
          else return (x) /1;
    icon: "mdi:clock"

  - platform: modbus_controller          # 152 Settings Timezone5
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_setting_timezone5
    id: ${inverter_name}_setting_timezone5
    register_type: holding
    address: 152
    filters:
      - lambda: |-
          if (x > 32767) return (x - 65535) /1;
          else return (x) /1;
    icon: "mdi:clock"

  - platform: modbus_controller          # 153 Settings Timezone6
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_setting_timezone6
    id: ${inverter_name}_setting_timezone6
    register_type: holding
    address: 153
    filters:
      - lambda: |-
          if (x > 32767) return (x - 65535) /1;
          else return (x) /1;
    icon: "mdi:clock"

  #############################  Power ####################

  - platform: modbus_controller          # 154 Power Timezone1
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_power_timezone1
    id: ${inverter_name}_power_timezone1
    register_type: holding
    address: 154
    unit_of_measurement: 'W'
    accuracy_decimals: 0
    icon: mdi:power
    filters:
      - lambda: return x * ${inverter_factor};

  - platform: modbus_controller          # 155 Power Timezone2
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_power_timezone2
    id: ${inverter_name}_power_timezone2
    register_type: holding
    address: 155
    unit_of_measurement: 'W'
    accuracy_decimals: 0
    icon: mdi:power
    filters:
      - lambda: return x * ${inverter_factor};

  - platform: modbus_controller          # 156 Power Timezone3
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_power_timezone3
    id: ${inverter_name}_power_timezone3
    register_type: holding
    address: 156
    unit_of_measurement: 'W'
    accuracy_decimals: 0
    icon: mdi:power
