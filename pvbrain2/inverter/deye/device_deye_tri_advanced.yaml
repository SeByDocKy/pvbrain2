select:

  # REG 146 — TOU days (complements the ON/OFF switch)
  # bit0 enable, bit1..bit7 = Monday..Sunday
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_tou_jours_semaine
    id: ${inverter_name}_tou_jours_semaine
    address: 146
    value_type: U_WORD
    entity_category: config
    icon: "mdi:calendar-clock"
    optionsmap:
      "❌ Désactivé": 0
      "✅ Tous les jours": 255
      "Lun – Ven": 63
      "Sam – Dim": 193

  # Charge type per time point (registers 172..177)
  # bit0 Grid, bit1 Gen, bit2 GM, bit3 BU, bit4 CH
  - platform: modbus_controller          # 172 Charge type Timezone1
    use_write_multiple: true
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_select_charge_timezone1
    id: ${inverter_name}_select_charge_timezone1
    address: 172
    entity_category: config
    icon: "mdi:numeric"
    optionsmap: &charge_type_options
      "Grid off, Gen off, GM off, BU off, CH off": 0
      "Grid on, Gen off, GM off, BU off, CH off": 1
      "Grid off, Gen on, GM off, BU off, CH off": 2
      "Grid on, Gen on, GM off, BU off, CH off": 3
      "Grid off, Gen off, GM on, BU off, CH off": 4
      "Grid on, Gen off, GM on, BU off, CH off": 5
      "Grid off, Gen on, GM on, BU off, CH off": 6
      "Grid on, Gen on, GM on, BU off, CH off": 7
      "Grid off, Gen off, GM off, BU on, CH off": 8
      "Grid on, Gen off, GM off, BU on, CH off": 9
      "Grid off, Gen on, GM off, BU on, CH off": 10
      "Grid on, Gen on, GM off, BU on, CH off": 11
      "Grid off, Gen off, GM off, BU off, CH on": 12
      "Grid on, Gen off, GM off, BU off, CH on": 13
      "Grid off, Gen on, GM off, BU off, CH on": 14
