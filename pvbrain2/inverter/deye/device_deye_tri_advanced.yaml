  - platform: modbus_controller          # 164 Battery Voltage Timezone5
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_battery_voltage_timezone5
    id: ${inverter_name}_battery_voltage_timezone5
    register_type: holding
    address: 164
