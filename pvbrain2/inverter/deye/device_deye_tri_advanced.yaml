    filters:
      - lambda: return x * ${inverter_factor};

  #############################  Battery Voltage ####################

  - platform: modbus_controller          # 160 Battery Voltage Timezone1
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_battery_voltage_timezone1
    id: ${inverter_name}_battery_voltage_timezone1
    register_type: holding
