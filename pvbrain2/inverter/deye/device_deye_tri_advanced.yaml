    filters:
      - multiply: 0.01

  - platform: modbus_controller          # 163 Battery Voltage Timezone4
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_battery_voltage_timezone4
    id: ${inverter_name}_battery_voltage_timezone4
    register_type: holding
    address: 163
