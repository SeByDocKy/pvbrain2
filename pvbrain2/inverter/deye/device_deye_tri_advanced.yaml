    filters:
      - multiply: 0.01

  #############################  Battery SOC ####################

  - platform: modbus_controller          # 166 Settings SoC Timezone1
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_setting_soc_timezone1
    id: ${inverter_name}_setting_soc_timezone1
