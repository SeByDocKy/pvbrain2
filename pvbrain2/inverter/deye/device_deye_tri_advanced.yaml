  - platform: modbus_controller          # 157 Power Timezone4
    modbus_controller_id: ${inverter_name}_modbus_controller
    name: ${name}_${inverter_name}_power_timezone4
    id: ${inverter_name}_power_timezone4
    register_type: holding
    address: 157
    unit_of_measurement: 'W'
    accuracy_decimals: 0
    icon: mdi:power
