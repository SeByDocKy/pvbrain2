    unit_of_measurement: 'W'
    accuracy_decimals: 2
    update_interval: ${inverter_template_update}
    icon: mdi:power  
    lambda: return ( (id(${inverter_name}_pv1_power).state) + (id(${inverter_name}_pv2_power).state) );     
    
