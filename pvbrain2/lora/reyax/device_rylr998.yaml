external_components:
  - source: github://SeByDocKy/myESPhome@main
    components: [rylr998]
    refresh: 10s

globals:
  - id: ${rylr998_name}_energy_yesterday_global
    type: float
    restore_value: yes    

time:
  - platform: sntp
    id: !extend my_time
    on_time:
      - seconds: 59
        minutes: 59
        hours: 23
        then:  
          - globals.set:
              id: energy_yesterday_global
              value: !lambda return ( id(${rylr998_name}_energy_yesterday_global) =  float( id(${rylr998_name}_energy_today).state) );
    
uart:
  - id: !extend ${rylr998_uart_id}              # ID of the UART to modify; Here for Linky.
    rx_buffer_size: 1024      
     
rylr998:
  - id: ${rylr998_id}
    uart_id: ${rylr998_uart_id}
    address: ${rylr998_address}
    frequency: 868MHz
    spreading_factor: 11 #9
    signal_bandwidth: 125kHz
    coding_rate: 2 #1
    preamble_length: 12
    network_id: 10
    tx_power: 20
    air_time: true
    # setup_priority: 1000
    
packet_transport:
  platform: rylr998
  rylr998_id: ${rylr998_id}
  update_interval: ${rylr998_update_interval}
  encryption: !secret encryption_key
  sensors:
    - ${rylr998_sensor_output_id}
  providers:
    - name: ${rylr998_controller}
      encryption: !secret encryption_key 

sensor:
  - platform: packet_transport
    provider: ${rylr998_controller}
    name: ${name}_${rylr998_name}_power_received
    id: ${rylr998_name}_power_received
    internal: false
    remote_id: ${rylr998_remote_id}
    accuracy_decimals: 1
    device_class: power
    unit_of_measurement: 'W'
    icon: mdi:power
    
  - platform: rylr998
    rylr998_id: ${rylr998_id}
    rssi:
      name: ${name}_${rylr998_name}_rssi
    snr:
      name: ${name}_${rylr998_name}_snr
    last_error:
      name: ${name}_${rylr998_name}_last_error

  - platform: total_daily_energy
    name: ${name}_${rylr998_name}_energy_today
    id: ${rylr998_name}_energy_today
    power_id: ${rylr998_name}_power_received
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    method: right
    restore: true
    filters:
      - multiply: 0.001
    icon: mdi:counter
    
  - platform: template
    name: ${name}_${rylr998_name}_energy_yesterday
    id: ${rylr998_name}_energy_yesterday
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    icon: mdi:counter
    update_interval: '2s'
    lambda: |-
      return (id(${rylr998_name}_energy_yesterday).state = id(${rylr998_name}_energy_yesterday_global));    

output:    
  - platform: template
    id: ${rylr998_fake_output_id}
    type: float
    write_action:
      - lambda: 'return;'

number:
  - platform: rylr998
    rylr998_id: ${rylr998_id}
    tx_power:
      name: ${name}_${rylr998_name}_tx_power      

button:
  - platform: rylr998
    rylr998_id: ${rylr998_id}
    reset:
      name: ${name}_${rylr998_name}_reset
