external_components:
  - source: "github://SeByDocKy/myESPhome/"
    components: [deyemi]
    refresh: 10s 

globals:
  - id: ${deyemi_name}_energy_yesterday_global
    type: float
    restore_value: yes
    
time:
  - platform: sntp
    id: !extend my_time
    on_time:
      - seconds: ${my_second}
        minutes: ${my_minute}
        hours: ${my_hours}
        then:  
          - globals.set:
              id: ${deyemi_name}_energy_yesterday_global
              value: !lambda return ( id(${deyemi_name}_energy_yesterday_global) =  float( id(${deyemi_name}_energy_today).state) );
            
deyemi:
  - id: ${deyemi_id}
    ip_address: ${deyemi_ip_address}
    ip_port: ${deyemi_ip_port}
    sn: ${deyemi_sn}
    poll_interval: ${deyemi_poll_interval}
    modbus_address: ${deyemi_modbus_address}
    model: 'deye_2mppt'

sensor:
  
  - platform: deyemi
    deyemi_id: ${deyemi_id}
    dc_channels:
      - pv0:
          voltage:
            name: ${name}_${deyemi_name}_pv0_voltage
          current:
            name: ${name}_${deyemi_name}_pv0_current
          power:
            name: ${name}_${deyemi_name}_pv0_power
      - pv1:
          voltage:
            name: ${name}_${deyemi_name}_pv1_voltage
          current:
            name: ${name}_${deyemi_name}_pv1_current
          power:
            name: ${name}_${deyemi_name}_pv1_power
    ac:
      voltage:
        name: ${name}_${deyemi_name}_grid_voltage
      current:
        name: ${name}_${deyemi_name}_grid_current
      frequency:
        name: ${name}_${deyemi_name}_grid_frequency
      power:
        name: ${name}_${deyemi_name}_power
        id: ${deyemi_name}_power
      energy_today:
        name: ${name}_${deyemi_name}_ac_energy_today
      energy_total:
        name: ${name}_${deyemi_name}_ac_energy_total
    inverter:
      temperature:
        name: ${name}_${deyemi_name}_temperature
      rated_power:
        name: ${name}_${deyemi_name}_rated_power

  - platform: total_daily_energy
    name: ${name}_${deyemi_name}_energy_today
    id: ${deyemi_name}_energy_today
    power_id: ${deyemi_name}_power
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    method: right
    restore: true
    filters:
        # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    icon: mdi:counter
    
  - platform: template
    name: ${name}_${deyemi_name}_energy_yesterday
    id: ${deyemi_name}_energy_yesterday
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    icon: mdi:counter
    # update_interval: ${hms_inverter_template_update}
    lambda: |-
      return (id(${deyemi_name}_energy_yesterday).state = id(${deyemi_name}_energy_yesterday_global));
      
text_sensor:
  - platform: deyemi
    deyemi_id: ${deyemi_id}
    inverter_status:
      name: ${name}_${deyemi_name}_inverter_status
    # event_alarms:
    #   name: ${name}_event_alarms
    # event_faults:
    #   name: ${name}_event_faults

number:
  - platform: deyemi
    deyemi_id: ${deyemi_id}
    power_percent:
      name: ${name}_${deyemi_name}_power_percent

output:
  - platform: deyemi
    deyemi_id: ${deyemi_id}
    power_percent:
      id: ${name}_${deyemi_name}_power_percent_output

