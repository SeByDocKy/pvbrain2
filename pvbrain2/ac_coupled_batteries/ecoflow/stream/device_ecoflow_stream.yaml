# EcoFlow STREAM 5000 / STREAM AC 5000: every entity, control and output (GENERATED by
# components/ecoflow_stream/tools/gen_yaml.py).
# Package vars:
#   ecoflow_name, ecoflow_id
#   ecoflow_model: stream5000 or stream_ac5000 (no PV input: dc_channels.pv0..pv3 are ignored)
#   ecoflow_modbus_controller (id of the modbus bus), ecoflow_modbus_address
#   ecoflow_fast_update_interval, ecoflow_slow_update_interval
#   ecoflow_charge_sign: negative or positive, sign of the target power which charges the battery.
#     NOT documented by EcoFlow: check it with a small value before using the outputs.
#   ecoflow_battery_power_charge_sign (optional, default positive): sign of the device battery power
#     while charging.
# Sign convention of this package: positive = charge, negative = discharge.
#
# The heartbeat switch starts OFF: turn it on to take control of the battery (needs "View and control" in
# the EcoFlow app). Without a heartbeat for 60 s the battery returns to its own energy management.
# Ids usable from the main YAML:
#   ${ecoflow_name}_ecoflow_charge_power, ${ecoflow_name}_ecoflow_discharge_power (outputs),
#   ${ecoflow_name}_heartbeat, ${ecoflow_name}_control_point, ${ecoflow_name}_battery_soc,
#   ${ecoflow_name}_battery_power, ${ecoflow_name}_ac_grid_power, ${ecoflow_name}_ac_home_power,
#   ${ecoflow_name}_system_master

defaults:
  ecoflow_battery_power_charge_sign: positive

external_components:
  - source: github://SeByDocKy/myESPhome
    components: [ecoflow_stream]
    refresh: 10s

modbus_controller:
  - id: ${ecoflow_name}_fast_modbus_controller
    address: ${ecoflow_modbus_address}
    modbus_id: ${ecoflow_modbus_controller}
    update_interval: ${ecoflow_fast_update_interval}
  # Slow-changing entities (versions, serial numbers, counters, settings) are polled less often
  - id: ${ecoflow_name}_slow_modbus_controller
    address: ${ecoflow_modbus_address}
    modbus_id: ${ecoflow_modbus_controller}
    update_interval: ${ecoflow_slow_update_interval}

ecoflow_stream:
  id: ${ecoflow_id}
  model: ${ecoflow_model}
  modbus_controller_id: ${ecoflow_name}_fast_modbus_controller
  slow_modbus_controller_id: ${ecoflow_name}_slow_modbus_controller
  charge_sign: ${ecoflow_charge_sign}
  battery_power_charge_sign: ${ecoflow_battery_power_charge_sign}
  # Point driven by the outputs: battery, inverter or grid_port
  control_point: battery
  # false: select the control point yourself; true: written before a setpoint when it differs
  auto_control_point: false
  # The battery reports its own maximum power. Set these only to limit it further.
  # max_charge_power: 800
  # max_discharge_power: 800
  heartbeat_interval: 20s
  setpoint_refresh: 0ms

sensor:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    ac:
      inverter_power:
        name: ${name}_${ecoflow_name}_ac_inverter_power
      home_power:
        id: ${ecoflow_name}_ac_home_power
        name: ${name}_${ecoflow_name}_ac_home_power
      grid_power:
        id: ${ecoflow_name}_ac_grid_power
        name: ${name}_${ecoflow_name}_ac_grid_power
      max_output_power:
        name: ${name}_${ecoflow_name}_ac_max_output_power
      max_input_power:
        name: ${name}_${ecoflow_name}_ac_max_input_power
      frequency:
        name: ${name}_${ecoflow_name}_ac_frequency
      grid_import_energy:
        name: ${name}_${ecoflow_name}_ac_grid_import_energy
      grid_export_energy:
        name: ${name}_${ecoflow_name}_ac_grid_export_energy
      home_energy:
        name: ${name}_${ecoflow_name}_ac_home_energy
      phases:
        phase0:
          power:
            name: ${name}_${ecoflow_name}_ac_phases_phase0_power
        phase1:
          power:
            name: ${name}_${ecoflow_name}_ac_phases_phase1_power
        phase2:
          power:
            name: ${name}_${ecoflow_name}_ac_phases_phase2_power
      bypass_power:
        name: ${name}_${ecoflow_name}_ac_bypass_power
    utc_time:
      name: ${name}_${ecoflow_name}_utc_time
    time_zone:
      name: ${name}_${ecoflow_name}_time_zone
    dc_channels:
      power:
        name: ${name}_${ecoflow_name}_dc_channels_power
      energy:
        name: ${name}_${ecoflow_name}_dc_channels_energy
      pv0:
        power:
          name: ${name}_${ecoflow_name}_dc_channels_pv0_power
      pv1:
        power:
          name: ${name}_${ecoflow_name}_dc_channels_pv1_power
      pv2:
        power:
          name: ${name}_${ecoflow_name}_dc_channels_pv2_power
      pv3:
        power:
          name: ${name}_${ecoflow_name}_dc_channels_pv3_power
    battery:
      power:
        id: ${ecoflow_name}_battery_power
        name: ${name}_${ecoflow_name}_battery_power
      soc:
        id: ${ecoflow_name}_battery_soc
        name: ${name}_${ecoflow_name}_battery_soc
      full_capacity:
        name: ${name}_${ecoflow_name}_battery_full_capacity
      pack_count:
        name: ${name}_${ecoflow_name}_battery_pack_count
      packs:
        pack0:
          soc:
            name: ${name}_${ecoflow_name}_battery_pack0_soc
          soh:
            name: ${name}_${ecoflow_name}_battery_pack0_soh
        pack1:
          soc:
            name: ${name}_${ecoflow_name}_battery_pack1_soc
          soh:
            name: ${name}_${ecoflow_name}_battery_pack1_soh
        pack2:
          soc:
            name: ${name}_${ecoflow_name}_battery_pack2_soc
          soh:
            name: ${name}_${ecoflow_name}_battery_pack2_soh
      charge_energy:
        name: ${name}_${ecoflow_name}_battery_charge_energy
      discharge_energy:
        name: ${name}_${ecoflow_name}_battery_discharge_energy
      charge_capability:
        name: ${name}_${ecoflow_name}_battery_charge_capability
      discharge_capability:
        name: ${name}_${ecoflow_name}_battery_discharge_capability
      min_cell_temperature:
        name: ${name}_${ecoflow_name}_battery_min_cell_temperature
      max_cell_temperature:
        name: ${name}_${ecoflow_name}_battery_max_cell_temperature
      max_cell_voltage:
        name: ${name}_${ecoflow_name}_battery_max_cell_voltage
      min_cell_voltage:
        name: ${name}_${ecoflow_name}_battery_min_cell_voltage
    system_fault_count:
      name: ${name}_${ecoflow_name}_system_fault_count
    system_device_count:
      name: ${name}_${ecoflow_name}_system_device_count
    system_online_device_count:
      name: ${name}_${ecoflow_name}_system_online_device_count
    device_fault_count:
      name: ${name}_${ecoflow_name}_device_fault_count

text_sensor:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    system_phase_type:
      name: ${name}_${ecoflow_name}_system_phase_type
    serial_number:
      name: ${name}_${ecoflow_name}_serial_number
    firmware_version:
      name: ${name}_${ecoflow_name}_firmware_version
    manufacturer:
      name: ${name}_${ecoflow_name}_manufacturer
    system_group_id:
      name: ${name}_${ecoflow_name}_system_group_id
    battery:
      packs:
        pack0:
          serial:
            name: ${name}_${ecoflow_name}_battery_pack0_serial
        pack1:
          serial:
            name: ${name}_${ecoflow_name}_battery_pack1_serial
        pack2:
          serial:
            name: ${name}_${ecoflow_name}_battery_pack2_serial
    system_fault_codes:
      name: ${name}_${ecoflow_name}_system_fault_codes
    device_fault_codes:
      name: ${name}_${ecoflow_name}_device_fault_codes

binary_sensor:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    system_master:
      id: ${ecoflow_name}_system_master
      name: ${name}_${ecoflow_name}_system_master
    on_grid:
      name: ${name}_${ecoflow_name}_on_grid
    modbus_connection:
      name: ${name}_${ecoflow_name}_modbus_connection

switch:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    bypass_ac1:
      name: ${name}_${ecoflow_name}_bypass_ac1
    heartbeat:
      name: ${name}_${ecoflow_name}_heartbeat
      id: ${ecoflow_name}_heartbeat
      restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    battery:
      backup_reserve:
        name: ${name}_${ecoflow_name}_battery_backup_reserve
      soc_lower_limit:
        name: ${name}_${ecoflow_name}_battery_soc_lower_limit
      soc_upper_limit:
        name: ${name}_${ecoflow_name}_battery_soc_upper_limit
    breaker_capacity:
      name: ${name}_${ecoflow_name}_breaker_capacity
    led_brightness:
      name: ${name}_${ecoflow_name}_led_brightness
    host_election_priority:
      name: ${name}_${ecoflow_name}_host_election_priority
    limits:
      battery_charge_power:
        name: ${name}_${ecoflow_name}_limits_battery_charge_power
      battery_discharge_power:
        name: ${name}_${ecoflow_name}_limits_battery_discharge_power
      meter_input_power:
        name: ${name}_${ecoflow_name}_limits_meter_input_power
      meter_output_power:
        name: ${name}_${ecoflow_name}_limits_meter_output_power
      inverter_output_power:
        name: ${name}_${ecoflow_name}_limits_inverter_output_power
      inverter_input_power:
        name: ${name}_${ecoflow_name}_limits_inverter_input_power
      grid_port_output_power:
        name: ${name}_${ecoflow_name}_limits_grid_port_output_power
      grid_port_input_power:
        name: ${name}_${ecoflow_name}_limits_grid_port_input_power
    targets:
      battery_power:
        name: ${name}_${ecoflow_name}_targets_battery_power
      meter_power:
        name: ${name}_${ecoflow_name}_targets_meter_power
      inverter_power:
        name: ${name}_${ecoflow_name}_targets_inverter_power
      grid_port_power:
        name: ${name}_${ecoflow_name}_targets_grid_port_power

select:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    control_point:
      id: ${ecoflow_name}_control_point
      name: ${name}_${ecoflow_name}_control_point

output:
  - platform: ecoflow_stream
    ecoflow_stream_id: ${ecoflow_id}
    charge_power:
      id: ${ecoflow_name}_ecoflow_charge_power
    discharge_power:
      id: ${ecoflow_name}_ecoflow_discharge_power