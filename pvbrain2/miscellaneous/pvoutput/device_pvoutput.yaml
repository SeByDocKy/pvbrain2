http_request:
  useragent: ESPHome-PVOutput-Client
  timeout: 5s

time:
  - platform: sntp
    id: time_${pvoutput_id}

    on_time:
      - seconds: /${pvoutput_update_interval_seconds} # PVOutput accepte une donnée toutes les 5 minutes (300s)
        then:
          - http_request.post:
              url: "https://pvoutput.org/service/r2/addstatus.jsp"
              headers:
                X-Pvoutput-Apikey: "${pvoutput_apikey}"
                X-Pvoutput-SystemId: "${pvoutput_systemid}"
                Content-Type: "application/x-www-form-urlencoded"
              body: !lambda |-
                // 1. Récupération de la date/heure courante depuis l'horloge
                auto time_now = id(time_${pvoutput_id}).now();
                char date_str[9];  // YYYYMMDD + null-terminator
                char time_str[6];  // HH:MM + null-terminator
                time_now.strftime(date_str, sizeof(date_str), "%Y%m%d");
                time_now.strftime(time_str, sizeof(time_str), "%H:%M");

                // 2. Récupération des valeurs des capteurs ESPHome
                float v1_energy_today = id(${pvoutput_energy_today}).state * 1000.0f; // Wh
                float v2_pv_power     = id(${pvoutput_total_pv_power}).state;             // W
                float v3_grid_energy_import  = id(${pvoutput_grid_energy_import}).state * 1000.0f; // Wh
                float v4_grid_power   = id(${pvoutput_grid_power}).state;                      // W
                float v5_temp         = id(${pvoutput_temperature}).state; // °C
                float v6_voltage      = id(${pvoutput_voltage}).state;                     // V

                // 3. Construction du corps de la requête POST (form-urlencoded)
                char body_buffer[300];
                snprintf(body_buffer, sizeof(body_buffer),
                         "d=%s&t=%s&v1=%.0f&v2=%.1f&v3=%.0f&v4=%.1f&v5=%.1f&v6=%.1f",
                         date_str,
                         time_str,
                         v1_energy_today,
                         v2_pv_power,
                         v3_grid_energy_import,
                         v4_grid_power,
                         v5_temp,
                         v6_voltage);

                return std::string(body_buffer);

              on_response:
                then:
                  - lambda: |-
                      if (response->status_code == 200) {
                        ESP_LOGI("pvoutput", "Send successfully to PVOutput!");
                      } else {
                        ESP_LOGW("pvoutput", "Fail to send to PVOutput, code HTTP: %d", response->status_code);
                      }
